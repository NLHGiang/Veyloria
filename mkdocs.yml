site_name: Veyloria
site_description: Veyloria — Game Design Knowledge Base
site_author: NLHGiang

theme:
  name: material
  language: vi
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Chế độ sáng
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

extra_css:
  - design/stylesheets/extra.css

nav:
  - Veyloria: index.md
  - Thiết kế:
      - Ý tưởng:
          - Tổng quan: design/concept/overview.md
          - The Forgotten One: design/concept/the-forgotten-one.md
          - Cơ chế lõi: design/concept/core-mechanic.md
      - Cách chơi:
          - Một phiên chơi: design/gameplay/session-design.md
          - Pet: design/gameplay/pet.md
      - Bản đồ:
          - The Bridge: design/maps/bridge.md
      - Nguyên tắc thiết kế: design/design-principles.md
      - Đề xuất DNA: design/decisions/dna-proposal.md
